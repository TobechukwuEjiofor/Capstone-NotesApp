server {
    listen 80;

    # Serve the static frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # Forward API calls to the backend container. "backend" resolves via
    # Docker Compose's internal DNS -- it only works inside the compose
    # network, which is what keeps the API off the public internet.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
